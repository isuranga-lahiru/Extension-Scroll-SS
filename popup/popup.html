<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuraTech Full Page Capture</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-wrap">
      <!-- Header -->
      <header class="popup-header">
        <div class="logo-row">
          <svg
            class="logo-icon"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <rect
              x="2"
              y="5"
              width="20"
              height="15"
              rx="2"
              stroke="url(#g1)"
              stroke-width="1.8"
            />
            <circle
              cx="12"
              cy="12"
              r="4"
              stroke="url(#g1)"
              stroke-width="1.8"
            />
            <circle cx="12" cy="12" r="1.5" fill="url(#g1)" />
            <path
              d="M8 5V3"
              stroke="url(#g1)"
              stroke-width="1.8"
              stroke-linecap="round"
            />
            <path
              d="M16 5V3"
              stroke="url(#g1)"
              stroke-width="1.8"
              stroke-linecap="round"
            />
            <defs>
              <linearGradient
                id="g1"
                x1="2"
                y1="2"
                x2="22"
                y2="22"
                gradientUnits="userSpaceOnUse"
              >
                <stop offset="0%" stop-color="#818cf8" />
                <stop offset="100%" stop-color="#38bdf8" />
              </linearGradient>
            </defs>
          </svg>
          <div class="logo-text">
            <span class="brand-name">AuraTech</span>
            <span class="brand-sub">Full Page Capture</span>
          </div>
        </div>
        <div id="tierPill" class="tier-pill tier-free">FREE</div>
      </header>

      <!-- Status bar (hidden by default) -->
      <div id="statusBar" class="status-bar hidden">
        <span id="statusIcon" class="status-icon">✓</span>
        <span id="statusText" class="status-text"></span>
      </div>

      <!-- Format selector -->
      <section class="section">
        <label class="section-label">Export Format</label>
        <div class="format-group" id="formatGroup">
          <button class="format-btn active" data-format="png">
            <span class="format-icon">🖼</span>
            <span>PNG</span>
          </button>
          <button class="format-btn" data-format="jpg">
            <span class="format-icon">📷</span>
            <span>JPG</span>
          </button>
          <button class="format-btn pro-gated" data-format="pdf" id="pdfBtn">
            <span class="format-icon">📄</span>
            <span>PDF</span>
            <span class="pro-badge" id="proBadge">PRO</span>
          </button>
        </div>
        <div id="pdfTooltip" class="pro-tooltip hidden">
          🔒 PDF export requires Pro — enter your license key below.
        </div>
      </section>

      <!-- Settings panel -->
      <section class="section">
        <button class="settings-toggle" id="settingsToggle">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"
            />
          </svg>
          Settings
          <span class="settings-chevron" id="settingsChevron">▾</span>
        </button>
        <div class="settings-panel hidden" id="settingsPanel">
          <div class="setting-row">
            <label class="setting-label">Hide Fixed/Sticky Elements</label>
            <label class="toggle-switch">
              <input type="checkbox" id="hideFixedToggle" checked />
              <span class="toggle-track"></span>
            </label>
          </div>
          <div class="setting-row">
            <label class="setting-label"
              >Scroll Delay
              <span class="setting-val" id="scrollDelayVal">200ms</span>
            </label>
            <input
              type="range"
              class="slider"
              id="scrollDelaySlider"
              min="100"
              max="800"
              step="50"
              value="200"
            />
          </div>
          <div class="setting-row" id="jpgQualityRow">
            <label class="setting-label"
              >JPG Quality
              <span class="setting-val" id="jpgQualityVal">92%</span>
            </label>
            <input
              type="range"
              class="slider"
              id="jpgQualitySlider"
              min="60"
              max="100"
              step="2"
              value="92"
            />
          </div>

          <!-- Dev-only Mock Pro toggle -->
          <div class="setting-row dev-row" id="devRow">
            <label class="setting-label dev-label">⚙ Mock Pro (Dev only)</label>
            <label class="toggle-switch">
              <input type="checkbox" id="mockProToggle" />
              <span class="toggle-track"></span>
            </label>
          </div>
        </div>
      </section>

      <!-- ── License Key Activation ── -->
      <section class="section license-section" id="licenseSection">
        <label class="section-label">Pro License</label>

        <!-- Free user: show key input + upgrade button -->
        <div id="licenseInputArea">
          <div class="license-row">
            <input
              type="text"
              id="licenseKeyInput"
              class="license-input"
              placeholder="Enter license key (e.g. PRO-XXXX)"
              autocomplete="off"
              spellcheck="false"
            />
            <button class="license-activate-btn" id="licenseActivateBtn">
              Activate
            </button>
          </div>
          <div id="licenseMsg" class="license-msg hidden"></div>
          <button class="upgrade-btn" id="upgradeBtn">⭐ Upgrade to Pro</button>
        </div>

        <!-- Pro user: show active badge + deactivate -->
        <div id="licenseActiveArea" class="hidden">
          <div class="license-active-badge">
            <span>✅ Pro License Active</span>
            <button class="license-deactivate-btn" id="licenseDeactivateBtn">
              Deactivate
            </button>
          </div>
        </div>
      </section>

      <!-- Capture button -->
      <button class="capture-btn" id="captureBtn">
        <svg
          class="btn-icon"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect x="2" y="5" width="20" height="15" rx="2" />
          <circle cx="12" cy="12" r="3" />
          <path d="M8 5V3M16 5V3" stroke-linecap="round" />
        </svg>
        Capture Full Page
      </button>

      <!-- Footer -->
      <footer class="popup-footer">
        <span
          >🔒 All processing is local — your data never leaves this
          device.</span
        >
      </footer>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
